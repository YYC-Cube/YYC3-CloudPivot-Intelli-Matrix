packages:
  - "."
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
overrides:
  # W4 dev 链漏洞治理（2026-09-17）：
  # plist@3 依赖的 @xmldom/xmldom@0.8 有 15 项 high 漏洞，
  # 上游 @electron/osx-sign@1.3.3 仍锁 ^3.0.5，强制提升至修复版 0.9.x
  "@xmldom/xmldom": "^0.9.12"
  # minimatch@3 锁定的 brace-expansion@1.x 与 @electron/asar 链的 2.0.x
  # 均有 ReDoS 高危（>=2.0.0 <2.1.2），强制提升至修复版 2.1.2+
  "brace-expansion@1": "^2.1.2"
  "brace-expansion@2": "^2.1.2"
  # @malept/flatpak-bundler 锁定的 tmp@0.2.5 有 Path Traversal 高危
  "tmp": "^0.2.7"
